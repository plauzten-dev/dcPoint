name: dcpoint

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcpoint
      POSTGRES_PASSWORD: dcpoint
      POSTGRES_DB: dcpoint
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcpoint"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dcpoint
      MINIO_ROOT_PASSWORD: dcpoint-minio-secret
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 dcpoint dcpoint-minio-secret &&
                  mc mb --ignore-existing local/dcpoint"
    restart: "no"

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dcpoint:dcpoint@postgres:5432/dcpoint
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-0123456789}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: dcpoint
      S3_ACCESS_KEY: dcpoint
      S3_SECRET_KEY: dcpoint-minio-secret
      CORS_ORIGINS: http://localhost:8000,http://localhost:5173,tauri://localhost,http://tauri.localhost
      TRUST_PROXY: "true"
      RUST_LOG: dcpoint=info,tower_http=warn
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8000:80"

volumes:
  postgres:
  minio:
