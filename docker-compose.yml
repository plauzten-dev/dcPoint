name: dcpoint

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcpoint
      POSTGRES_PASSWORD: dcpoint
      POSTGRES_DB: dcpoint
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcpoint"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # S3-compatible object storage. MinIO no longer publishes images on Docker Hub,
  # so SeaweedFS is used; any S3-compatible service works via S3_ENDPOINT.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    volumes:
      - seaweedfs:/data
      - ./deploy/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333"

  # Creates the upload bucket once SeaweedFS is reachable.
  s3-init:
    image: amazon/aws-cli:latest
    depends_on:
      - seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: dcpoint
      AWS_SECRET_ACCESS_KEY: dcpoint-s3-secret-change-me
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 90); do
          aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket dcpoint 2>/dev/null && echo "bucket ready" && exit 0
          aws --endpoint-url http://seaweedfs:8333 s3 mb s3://dcpoint 2>/dev/null && echo "bucket created" && exit 0
          sleep 2
        done
        echo "S3 not reachable"
        exit 1
    restart: "no"

  livekit:
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  server:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://dcpoint:dcpoint@postgres:5432/dcpoint
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-0123456789}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: dcpoint
      S3_ACCESS_KEY: dcpoint
      S3_SECRET_KEY: dcpoint-s3-secret-change-me
      CORS_ORIGINS: http://localhost:8000,http://localhost:5173,tauri://localhost,http://tauri.localhost
      TRUST_PROXY: "true"
      RUST_LOG: dcpoint=info,tower_http=warn
    ports:
      - "8080:8080"

  web:
    build: ./web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8000:80"

volumes:
  postgres:
  seaweedfs:
